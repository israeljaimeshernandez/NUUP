; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; ENTORNO DEFAULT - El botón "Upload" usará este
; ============================================================================
[platformio]
default_envs = test_ap

; Para cambiar a versión completa, cambia a: default_envs = nodemcu-32s
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
    sandeepmistry/LoRa@^0.8.0
; Para compilar: pio run -e nodemcu-32s
; Para subir: pio run -e nodemcu-32s -t upload

; ============================================================================
; ENTORNO DE TEST - Solo Portal Cautivo (SIN HARDWARE)
; ============================================================================
[env:test_ap]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter = 
    +<*>
    -<main.cpp>
    -<main_backup_original.cpp>
    +<main_test_ap.cpp>
; Para compilar: pio run -e test_ap
; Para subir: pio run -e test_ap -t upload
; Sin dependencias extras - solo WiFi/Web/DNS integrados