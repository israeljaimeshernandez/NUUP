; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ============================================================================
; ENTORNO DEFAULT - El botón "Upload" usará este
; ============================================================================
[platformio]
default_envs = portal_completo

; Para cambiar a versión completa, cambia a: default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = 
	sandeepmistry/LoRa@^0.8.0
	knolleary/PubSubClient@^2.8
	#Pantalla OLED
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
	lovyan03/LovyanGFX@^1.2.7

; ============================================================================
; ENTORNO DE TEST - Solo Portal Cautivo (SIN HARDWARE)
; ============================================================================
[env:test_ap]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
build_src_filter = 
    +<*>
    -<main.cpp>
    -<main_portal_completo.cpp>
    +<main_test_ap.cpp>
; Sin dependencias extras - solo WiFi/Web/DNS integrados

; ============================================================================
; PORTAL COMPLETO - Portal Moderno con WhatsApp
; ============================================================================
[env:portal_completo]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_ldf_mode = deep
lib_compat_mode = strict
lib_ignore = HttpClient
build_src_filter = 
    +<*>
    -<main.cpp>
    -<main_test_ap.cpp>
    +<main_portal_completo.cpp>
build_flags = 
    -D CORE_DEBUG_LEVEL=3
; WiFi/Web/DNS/HTTPClient integrados en framework (no HttpClient externo)
